# Générer les fixtures génériques avec AliceBundle intégrant par défaut Faker pour les entités User, Author, et Admin
# Créer un Admin avec un alias
App\Entity\Admin:
  admin_1:
    email: "jean-dupont@test.com"
    password: <hashPassword('1234')>
    firstname: "Jean"
    lastname: "DUPONT"
    roles: ["ROLE_ADMIN"]

  # Créer un ensemble d'utilisateurs ayant un rôle d'auteur
App\Entity\User:
  user_{1..12}:
    email: user<current()>\@domain.fr
    password: <hashPassword('1234')>
    firstname: <firstname()>
    lastname: <lastname()>
    roles: ["ROLE_USER"]

# Générer les fixtures d'auteurs
App\Entity\Author:
  # Créer un ensemble de 10 auteurs de façon aléatoire
  author_{1..10}:
    email (unique): author<current()>\@domain.fr
    password: <hashPassword('1234')>
    firstname: <firstname()>
    lastname: <lastname()>
    roles: ["ROLE_AUTHOR"]
